# ========================================
# Emplace — CraftEngine 가구를 미리보기로 놓기
# ========================================
#
# 가구 아이템을 우클릭하면 바로 놓이지 않고, 반투명 미리보기가 시선을 따라다닌다.
# 자리와 방향을 잡은 뒤 한 번 더 우클릭하면 그때 놓인다.
#
#   좌클릭          회전 (웅크리고 좌클릭 = 반대 방향)
#   우클릭          설치
#   웅크리기        취소
#
# 미리보기의 크기·위치·회전·조명은 가구 정의에서 그대로 읽는다.
# 여기에 따로 적을 값이 없고, 어떤 가구든 실물과 같게 보인다.

# 미리보기로 놓지 '않을' 가구.
# 여기 적은 것만 CraftEngine 이 하던 대로 우클릭 즉시 놓인다.
# 나머지는 전부 미리보기를 거친다. 새 리소스팩을 깔아도 자동으로 먹힌다.
#
# 예시:
# excluded-furniture:
#   - "default:bench"
#   - "myPack:small_plant"
excluded-furniture:
  # 농사 설비는 CraftEngine 가구로 만들어져 있지만 **놓는 물건**입니다.
  # 미리보기를 거치면 오히려 설치가 어려워서 CraftEngine 이 하던 대로 둡니다
  - "customcrops:sprinkler_1"
  - "customcrops:sprinkler_2"
  - "customcrops:sprinkler_3"
  - "customcrops:scarecrow"

# 놓을 자리를 찾는 거리(블록).
reach: 5.0

preview:
  # 놓을 수 있으면 초록, 못 놓으면 빨강으로 빛나게 한다.
  glow: true
  # 조작 안내를 액션바에 계속 띄운다.
  action-bar: true

# ---------------------------------------------------------------------------
#  놓는 중 조작
# ---------------------------------------------------------------------------
#    좌클릭        회전
#    F (손 바꾸기)  반대로 회전
#    우클릭        설치
#    웅크리기       격자 켜고 끄기
#    Q (버리기)     취소
#    슬롯 바꾸기    취소
controls:
  # 웅크리면 격자를 켜고 끈다. 끄면 /emplace 격자 로만 바꾼다.
  #
  # 예전에는 웅크리기가 취소였다. 격자를 손에서 떼지 않고 바꿀 수 있어야 해서
  # 그 자리로 옮겼고, 취소는 Q 와 슬롯 바꾸기가 그대로 한다.
  sneak-to-cycle-grid: true

# ---------------------------------------------------------------------------
#  격자 — 가구가 놓이는 좌표를 일정한 간격에 맞춘다
# ---------------------------------------------------------------------------
#  기본은 0.5칸(half)이다. 가구가 놓이는 좌표가 언제나 0.5 의 배수가 되므로
#  블록 한가운데에도, 두 블록 경계에도 딱 맞출 수 있다. 반 칸 옮겨 붙이는 것이
#  되니 탁자 두 개를 이어 붙이거나 의자를 탁자 모서리에 대는 것이 그냥 된다.
#
#  놓는 중에 웅크리면 half <-> furniture 를 오간다.
#
#    half        ½칸 — 0.0 · 0.5 · 1.0 (기본)
#    quarter     ¼칸 — 의자를 탁자 네 귀퉁이에 붙일 때
#    eighth      ⅛칸 — 잘게 맞출 때
#    center      무엇을 찍든 언제나 블록 한가운데. 경계에는 못 놓는다
#    furniture   가구가 원래 정해 둔 자리
#    free        안 맞춤. 본 자리에 그대로 — 벽에 딱 붙일 때
#
#  더 잘게 맞춰야 하면 /emplace 격자 <이름> 으로 골라 쓴다. 고른 것은 사람마다
#  남아서 계속 이어진다.
grid:
  # 아무것도 안 고른 사람이 쓸 값.
  default: half

# ---------------------------------------------------------------- 유령 판정 청소
#
#  가구를 회전시키면 히트박스를 새 각도로 다시 놓는데, 이때 옛 히트박스가
#  안 지워진 채 남는 일이 있습니다. 그 뒤 가구를 부수면 몸통만 사라지고
#  보이지 않는 벽만 남습니다 — /setblock 으로는 안 지워집니다.
#
#  주인이 없는 판정만 골라 치웁니다. CraftEngine 에게 "이 판정이 어느 가구
#  것이냐" 를 물어서 답이 없는 것만 지우므로, 살아 있는 가구는 안 건드립니다.
#
#  손으로 훑으려면 /emplace 청소 [반경]
cleanup:
  # 가구를 부술 때마다 그 언저리를 자동으로 살필지
  sweep-on-break: true
  # 부순 자리에서 이 반경만 살핍니다 (블록)
  sweep-radius: 4.0
  # 부순 뒤 몇 틱 있다가 볼지. CraftEngine 이 자기 몫을 치울 틈을 줍니다.
  # 너무 짧게 두면 멀쩡한 판정이 주인 없는 것처럼 보입니다
  sweep-delay-ticks: 2

  # CraftEngine 이 **자기 것이라고도 안 하는** 찌꺼기까지 치울지.
  # 회전시킬 때 옛 히트박스의 등록이 끊기면 CraftEngine 이 그 엔티티를 아예
  # 모르게 되어 '주인 없는 CE 것' 그물에 안 걸립니다. 켜 두면 생김새로 한 번
  # 더 거릅니다 — 저장되는 interaction/안 보이는 셜커 중 태운 것도 이름도 없고
  # CraftEngine 이 모르는 것. Simmer 판정은 저장되지 않아 안 걸립니다.
  deep: true

# 미리보기가 안 보일 때 켠다. 가로챈 가구와 띄운 조각 수를 로그에 남긴다.
# 조각이 0개면 가구 정의로 못 그렸다는 뜻이고, 그때는 손에 든 아이템으로 대신 띄운다.
debug: false

# MiniMessage 문법을 쓴다. https://docs.advntr.dev/minimessage/format.html
messages:
  hint: "<gray>좌클릭 <white>회전<gray> · 우클릭 <white>설치<gray> · 웅크리기 <white>격자<gray> · Q <white>취소"
  hint-blocked: "<red>여기에는 놓을 수 없습니다"
  cannot-place: "<red>여기에는 놓을 수 없습니다."
  place-failed: "<red>가구를 놓지 못했습니다."
